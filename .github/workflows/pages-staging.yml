name: pages-staging

# Staging-деплой для теста Telegram Mini App (заход 23/24, см. AGENT_LOG.md).
# Отдельно от продакшен-канала на Cloudflare Pages (тот настроен на
# оригинальном map-profile-app через Git-интеграцию Cloudflare, сюда не
# переносился). --base нужен из-за поддиректории GitHub Pages
# (https://<owner>.github.io/<repo>/) — vite.config.ts НЕ менялся, флаг
# передаётся только здесь, в CI.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          # Supabase-проект map-profile-app-copychatGPT (заход 26, AGENT_LOG.md).
          # VITE_SUPABASE_ANON_KEY — публичный anon-ключ, предназначен для
          # клиентского кода (защита — RLS-политики на стороне БД, не секрет
          # этого ключа), поэтому хранится прямо здесь, а не в GH Secrets —
          # запись в Secrets/Variables через API этой сессии заблокирована
          # прокси (403), а commit правится без ручных шагов от Alex.
          VITE_USE_SUPABASE: 'true'
          VITE_SUPABASE_URL: 'https://rozkposfqotsgkoqqabm.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvemtwb3NmcW90c2drb3FxYWJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDc3NjMsImV4cCI6MjEwNjk4Mzc2M30.jZ7gnR4ClY5zVSqL99R8fkXAeGYHTcF3Hmm_X3927dQ'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
